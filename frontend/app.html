<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FirstShift AR</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/hud.css">
</head>
<body>

<!-- ── КАМЕРА + AR ─────────────────────────────────────────── -->
<div id="camera-container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>
  <div id="camera-error" class="hidden">
    <div class="icon">📷</div>
    <h3>Нет доступа к камере</h3>
    <p>Разреши доступ к камере в настройках браузера.</p>
    <button class="btn btn-primary" id="btn-retry-camera" style="margin-top:16px">Попробовать снова</button>
  </div>
</div>

<!-- ── HUD TOP — тонкая полоска XP ───────────────────────── -->
<div id="hud-top">
  <div id="hud-avatar">?</div>
  <div id="hud-profile">
    <div id="hud-header-row">
      <span id="hud-username">Загрузка...</span>
      <span id="hud-level-label">LVL 1</span>
    </div>
    <div id="hud-xp-bar" class="xp-bar-wrap">
      <div id="hud-xp-fill" class="xp-bar-fill" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- ── HUD BOTTOM — карточка активного квеста ────────────── -->
<div id="hud-bottom">
  <div id="active-quest-card">
    <div id="quest-card-label">🎯 АКТИВНЫЙ КВЕСТ</div>
    <div id="quest-card-title">Загрузка...</div>
    <div id="quest-card-desc"></div>
    <div id="quest-card-xp"></div>
  </div>
  <div id="no-active-quest" class="hidden">
    Нет активного квеста —
    <span onclick="QuestEngine.openModal()">выбрать →</span>
  </div>
</div>

<!-- ── TAB BAR ────────────────────────────────────────────── -->
<nav id="tab-bar">

  <!-- Камера -->
  <button class="tab-item" id="tab-camera" onclick="Tab.camera()">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    <span class="tab-label">Камера</span>
  </button>

  <!-- Задания -->
  <button class="tab-item" id="tab-quests" onclick="Tab.quests()">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
    <span class="tab-label">Задания</span>
  </button>

  <!-- Энциклопедия -->
  <button class="tab-item" id="tab-encyclopedia" onclick="Tab.encyclopedia()">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>
    <span class="tab-label">Справочник</span>
  </button>

  <!-- Профиль -->
  <button class="tab-item" id="tab-profile" onclick="Tab.profile()">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span class="tab-label">Профиль</span>
  </button>

  <!-- Admin — показывается только для hr/admin -->
  <button class="tab-item" id="tab-admin" onclick="Tab.admin()" style="display:none;color:#ffaa00">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
    </svg>
    <span class="tab-label">Admin</span>
  </button>

</nav>

<!-- ── МОДАЛКА — ЗАДАНИЯ (квесты + ачивки) ───────────────── -->
<div id="quest-modal">
  <div id="quest-modal-inner">

    <!-- Шапка с табами -->
    <div id="quest-modal-header">
      <div id="quest-tabs">
        <button class="quest-tab active" id="qtab-quests"
          onclick="QuestEngine.switchTab('quests')">Квесты</button>
        <button class="quest-tab" id="qtab-achievements"
          onclick="QuestEngine.switchTab('achievements')">Ачивки</button>
      </div>
      <button class="modal-close-btn" onclick="QuestEngine.closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Список квестов -->
    <div id="quest-list-panel" class="scroll-y modal-panel"></div>

    <!-- Список ачивок -->
    <div id="achievements-list-panel" class="scroll-y modal-panel hidden"></div>

  </div>
</div>

<!-- ── УВЕДОМЛЕНИЯ ────────────────────────────────────────── -->
<div id="xp-popup" class="xp-popup">+50 XP</div>
<div id="levelup-popup">
  <div id="levelup-inner">
    <h2>🎉</h2>
    <p id="levelup-level">Уровень 2!</p>
    <small id="levelup-title">Помощник оператора</small>
  </div>
</div>

<!-- ── СКРИПТЫ ────────────────────────────────────────────── -->
<script src="/static/js/api.js"></script>
<script src="/static/js/camera.js"></script>
<script src="/static/js/ar-overlay.js"></script>
<script src="/static/js/xp-bar.js"></script>
<script src="/static/js/achievements.js"></script>
<script src="/static/js/speedrun.js"></script>
<script src="/static/js/quiz.js"></script>
<script src="/static/js/quest-engine.js"></script>
<script src="/static/js/vision-client.js"></script>
<script src="/static/js/mascot.js"></script>
<script src="/static/js/onboarding.js"></script>
<script src="/static/js/app.js"></script>

<script>
  // Tab actions
  const Tab = {
    camera()      { Camera.toggle().then(m => {
      document.getElementById('tab-camera').classList.add('flash');
      setTimeout(() => document.getElementById('tab-camera').classList.remove('flash'), 300);
    }); },
    quests()      { QuestEngine.openModal('quests'); },
    encyclopedia(){ window.location.href = '/encyclopedia'; },
    profile()     { window.location.href = '/profile'; },
    admin()       { window.location.href = '/admin'; },
  };
</script>

</body>
</html>
