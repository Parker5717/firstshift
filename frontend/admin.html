<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstShift — Admin</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body { min-height:100vh; overflow-y:auto; padding:0 0 48px; display:block; background:#070b14; }

    #top-bar {
      display:flex; align-items:center; gap:12px;
      padding:12px 20px; background:rgba(7,11,20,0.96);
      border-bottom:1px solid rgba(0,170,255,0.15);
      position:sticky; top:0; z-index:20;
    }
    .logo { font-family:monospace; font-size:15px; font-weight:700; color:var(--accent); letter-spacing:2px; }
    .admin-badge {
      padding:3px 10px; border-radius:20px; font-size:10px;
      font-family:monospace; font-weight:700; letter-spacing:1px;
      background:rgba(255,170,0,0.12); border:1px solid rgba(255,170,0,0.4); color:#ffaa00;
    }
    #top-bar-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
    .top-user { font-size:13px; color:var(--text-secondary); }
    .btn-sm {
      padding:7px 14px; border-radius:8px; font-size:12px; font-weight:600;
      border:1px solid var(--border); background:transparent;
      color:var(--text-secondary); cursor:pointer; transition:all 0.2s; font-family:inherit;
    }
    .btn-sm:hover { border-color:var(--accent); color:var(--accent); }
    .btn-danger { border-color:rgba(255,51,85,0.4) !important; color:#ff3355 !important; }
    .btn-danger:hover { background:rgba(255,51,85,0.1) !important; }

    .page { max-width:1200px; margin:0 auto; padding:24px 20px; }

    .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
    .stat-card { padding:16px 18px; border-radius:14px; border:1px solid var(--border); background:var(--bg-glass); }
    .stat-card .val { font-size:28px; font-weight:900; color:var(--text-primary); }
    .stat-card .lbl { font-size:11px; color:var(--text-secondary); margin-top:4px; font-family:monospace; }

    .section { margin-bottom:32px; }
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .section-title { font-size:12px; font-family:monospace; color:var(--accent); letter-spacing:1px; text-transform:uppercase; font-weight:700; }

    .search-input {
      padding:8px 14px; border-radius:10px;
      border:1px solid var(--border); background:rgba(0,170,255,0.05);
      color:var(--text-primary); font-size:13px; font-family:inherit;
      outline:none; width:200px; transition:all 0.2s;
    }
    .search-input:focus { border-color:var(--accent); width:240px; }

    .emp-table { width:100%; border-collapse:collapse; }
    .emp-table th {
      text-align:left; padding:10px 14px;
      font-size:10px; font-family:monospace; color:var(--text-dim);
      letter-spacing:1px; text-transform:uppercase;
      border-bottom:1px solid var(--border);
    }
    .emp-table td { padding:11px 14px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
    .emp-table tr:hover td { background:rgba(0,170,255,0.03); cursor:pointer; }

    .emp-avatar {
      width:32px; height:32px; border-radius:50%;
      background:linear-gradient(135deg,#0055aa,#00aaff);
      border:1.5px solid var(--accent);
      display:inline-flex; align-items:center; justify-content:center;
      font-size:13px; font-weight:700; color:#fff; flex-shrink:0;
    }
    .emp-name { font-size:14px; font-weight:600; color:var(--text-primary); }
    .emp-username { font-size:11px; color:var(--text-dim); font-family:monospace; }

    .role-badge {
      padding:3px 9px; border-radius:20px; font-size:10px;
      font-family:monospace; font-weight:700; letter-spacing:0.5px; white-space:nowrap;
    }
    .role-admin    { background:rgba(255,51,85,0.12);  border:1px solid rgba(255,51,85,0.4);  color:#ff3355; }
    .role-hr       { background:rgba(255,170,0,0.12);  border:1px solid rgba(255,170,0,0.4);  color:#ffaa00; }
    .role-mentor   { background:rgba(170,136,255,0.12);border:1px solid rgba(170,136,255,0.4);color:#aa88ff; }
    .role-employee { background:rgba(0,170,255,0.08);  border:1px solid rgba(0,170,255,0.25); color:var(--accent); }

    .progress-wrap { width:110px; }
    .progress-bar-bg { height:5px; background:rgba(255,255,255,0.07); border-radius:3px; overflow:hidden; }
    .progress-bar-fill { height:100%; border-radius:3px; background:var(--accent); }
    .progress-label { font-size:11px; color:var(--text-secondary); font-family:monospace; margin-top:3px; }

    .xp-cell  { font-size:13px; font-weight:700; color:var(--success); font-family:monospace; }
    .date-cell { font-size:11px; color:var(--text-dim); font-family:monospace; }
    .mentor-cell { font-size:12px; color:var(--text-secondary); }

    .select-sm {
      padding:5px 8px; border-radius:8px; font-size:12px;
      border:1px solid var(--border); background:var(--bg-panel);
      color:var(--text-primary); cursor:pointer; font-family:monospace;
    }

    /* Safety */
    .safety-grid { display:flex; flex-direction:column; gap:8px; }
    .safety-col-title { font-size:12px; font-family:monospace; font-weight:700; margin-bottom:10px; }
    .safety-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:10px;
      border:1px solid var(--border); background:var(--bg-glass); margin-bottom:8px;
    }
    .safety-item.passed { border-color:rgba(0,255,136,0.25); background:rgba(0,255,136,0.04); }
    .safety-item.failed { border-color:rgba(255,51,85,0.2); }
    .safety-name { font-size:13px; font-weight:600; color:var(--text-primary); }
    .safety-time { font-size:11px; color:var(--text-dim); font-family:monospace; }

    /* Детальная панель квестов */
    #detail-panel {
      position:fixed; top:0; right:0; bottom:0; width:380px;
      background:var(--bg-dark); border-left:1px solid var(--border);
      z-index:30; transform:translateX(100%);
      transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
      display:flex; flex-direction:column;
    }
    #detail-panel.open { transform:translateX(0); }

    #detail-header {
      padding:16px 18px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:12px; flex-shrink:0;
    }
    #detail-close {
      width:30px; height:30px; border-radius:50%;
      border:1px solid var(--border); background:transparent;
      color:var(--text-secondary); cursor:pointer; font-size:16px;
      display:flex; align-items:center; justify-content:center;
      transition:all 0.2s; margin-left:auto;
    }
    #detail-close:hover { border-color:var(--danger); color:var(--danger); }
    #detail-name { font-size:16px; font-weight:700; color:var(--text-primary); }
    #detail-meta { font-size:12px; color:var(--text-secondary); margin-top:2px; }

    #detail-body { flex:1; overflow-y:auto; padding:16px 18px; }

    .quest-row {
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:10px;
      border:1px solid var(--border); background:var(--bg-glass);
      margin-bottom:8px;
    }
    .quest-row.completed { border-color:rgba(0,255,136,0.25); }
    .quest-row.active    { border-color:rgba(0,170,255,0.35); }
    .quest-row.locked    { opacity:0.45; }

    .quest-icon { font-size:18px; flex-shrink:0; width:28px; text-align:center; }
    .quest-info { flex:1; min-width:0; }
    .quest-title-sm { font-size:13px; font-weight:600; color:var(--text-primary); }
    .quest-status-sm { font-size:11px; font-family:monospace; margin-top:2px; }
    .quest-xp { font-size:12px; font-family:monospace; color:var(--success); font-weight:700; flex-shrink:0; }

    .status-completed { color:var(--success); }
    .status-active    { color:var(--accent); }
    .status-available { color:var(--text-secondary); }
    .status-locked    { color:var(--text-dim); }

    .loading { text-align:center; padding:40px; color:var(--text-dim); font-size:14px; }
    .empty   { text-align:center; padding:20px; color:var(--text-dim); font-size:13px; }

    #overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.5);
      z-index:25; opacity:0; pointer-events:none; transition:opacity 0.3s;
    }
    #overlay.open { opacity:1; pointer-events:all; }
  </style>
</head>
<body>

<div id="top-bar">
  <div class="logo">FIRSTSHIFT</div>
  <div class="admin-badge">ADMIN PANEL</div>
  <div id="top-bar-right">
    <span class="top-user" id="top-username">Загрузка...</span>
    <button class="btn-sm" onclick="window.location.href='/app'">← Приложение</button>
    <button class="btn-sm btn-danger" onclick="sessionStorage.removeItem('casper_token'); window.location.href='/'">Выйти</button>
  </div>
</div>

<div class="page">

  <!-- Статистика -->
  <div class="stats-row">
    <div class="stat-card"><div class="val" id="stat-total">—</div><div class="lbl">СОТРУДНИКОВ</div></div>
    <div class="stat-card"><div class="val" id="stat-active">—</div><div class="lbl">АКТИВНЫ СЕГОДНЯ</div></div>
    <div class="stat-card"><div class="val" id="stat-safety">—</div><div class="lbl">SAFETY CHECK СЕГОДНЯ</div></div>
    <div class="stat-card"><div class="val" id="stat-avg">—</div><div class="lbl">СРЕДНЕЕ ВЫПОЛНЕНИЕ</div></div>
  </div>

  <!-- Таблица сотрудников -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">👥 Сотрудники</div>
      <input class="search-input" id="search" placeholder="🔍 Поиск..." oninput="filterTable()">
    </div>
    <div id="emp-loading" class="loading">Загрузка...</div>
    <table class="emp-table" id="emp-table" style="display:none">
      <thead>
        <tr>
          <th>Сотрудник</th>
          <th>Роль</th>
          <th>Уровень</th>
          <th>XP</th>
          <th>Прогресс</th>
          <th>Наставник</th>
          <th>Активность</th>
          <th>Управление</th>
        </tr>
      </thead>
      <tbody id="emp-tbody"></tbody>
    </table>
  </div>

  <!-- Safety Check -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">🛡️ Safety Check — сегодня</div>
      <button class="btn-sm" onclick="loadSafety()">↻ Обновить</button>
    </div>
    <div id="safety-loading" class="loading">Загрузка...</div>
    <div class="safety-grid" id="safety-grid" style="display:none">
      <div id="safety-list"></div>
    </div>
  </div>

</div>

<!-- Боковая панель квестов -->
<div id="overlay" onclick="closeDetail()"></div>
<div id="detail-panel">
  <div id="detail-header">
    <div>
      <div id="detail-name">—</div>
      <div id="detail-meta">—</div>
    </div>
    <div style="display:flex;gap:8px;margin-left:auto;align-items:center">
      <button onclick="downloadPDF(7)"  class="btn-sm" title="PDF за 7 дней">📄 7 дней</button>
      <button onclick="downloadPDF(30)" class="btn-sm" title="PDF за 30 дней">📄 30 дней</button>
      <button id="detail-close" onclick="closeDetail()" style="width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg-panel);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
    </div>
  </div>
  <div id="detail-body">
    <div class="loading">Выбери сотрудника</div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  if (!API.hasToken()) { window.location.href = '/'; }

  const token = sessionStorage.getItem('casper_token');
  const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

  async function apiFetch(path, opts = {}) {
    const resp = await fetch(path, { headers, ...opts });
    if (resp.status === 401) { sessionStorage.removeItem('casper_token'); window.location.href = '/'; }
    if (resp.status === 403) { window.location.href = '/app'; }
    if (!resp.ok) throw new Error((await resp.json()).detail || `HTTP ${resp.status}`);
    return resp.json();
  }

  const ROLE_LABELS = { employee:'Сотрудник', mentor:'Наставник', hr:'HR', admin:'Администратор' };
  const QUEST_ICONS = { discovery:'🔍', safety:'🦺', knowledge:'📚', speed_run:'⚡' };
  const STATUS_LABELS = { completed:'Выполнен', active:'Активен', available:'Доступен', locked:'Заблокирован', failed:'Провален' };

  function roleBadge(role) {
    return `<span class="role-badge role-${role}">${ROLE_LABELS[role] || role}</span>`;
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    // Добавляем Z чтобы JS парсил как UTC (SQLite хранит без timezone)
    const dt = iso.endsWith('Z') ? iso : iso + 'Z';
    const diff = Math.floor((Date.now() - new Date(dt)) / 60000);
    if (diff < 1)    return 'только что';
    if (diff < 60)   return `${diff} мин. назад`;
    if (diff < 1440) return `${Math.floor(diff/60)} ч. назад`;
    return new Date(dt).toLocaleDateString('ru-RU');
  }

  function fmtTime(iso) {
    if (!iso) return '';
    const dt = iso.endsWith('Z') ? iso : iso + 'Z';
    return new Date(dt).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  }

  // ── Загрузка ──────────────────────────────────────────────
  let _allEmployees = [];
  let _myRole = '';
  let _mentors = [];

  async function loadEmployees() {
    try {
      const profile = await API.getProfile();
      _myRole = profile.role;
      document.getElementById('top-username').textContent =
        `${profile.display_name} · ${ROLE_LABELS[profile.role] || profile.role}`;

      if (!['hr','admin'].includes(profile.role)) { window.location.href = '/app'; return; }

      const users = await apiFetch('/api/admin/users');
      _allEmployees = users;
      _mentors = users.filter(u => ['mentor','hr','admin'].includes(u.role));

      const today = new Date(); today.setHours(0,0,0,0);
      const activeToday = users.filter(u => new Date(u.last_active_at) >= today).length;
      const avgPct = users.length
        ? Math.round(users.reduce((s,u) => s + u.completion_pct, 0) / users.length) : 0;

      document.getElementById('stat-total').textContent  = users.length;
      document.getElementById('stat-active').textContent = activeToday;
      document.getElementById('stat-avg').textContent    = avgPct + '%';

      renderTable(users);
    } catch(e) {
      document.getElementById('emp-loading').textContent = 'Ошибка: ' + e.message;
    }
  }

  function renderTable(users) {
    const tbody = document.getElementById('emp-tbody');
    tbody.innerHTML = '';

    if (!users.length) {
      document.getElementById('emp-loading').style.display = 'block';
      document.getElementById('emp-loading').textContent = 'Нет сотрудников';
      document.getElementById('emp-table').style.display = 'none';
      return;
    }
    document.getElementById('emp-loading').style.display = 'none';
    document.getElementById('emp-table').style.display   = 'table';

    const mentorOptions = [
      '<option value="">— нет —</option>',
      ..._mentors.map(m => `<option value="${m.id}">${m.display_name || m.username}</option>`)
    ].join('');

    const roleOptions = ['employee','mentor','hr','admin']
      .map(r => `<option value="${r}">${ROLE_LABELS[r]}</option>`).join('');

    users.forEach(u => {
      const tr = document.createElement('tr');
      tr.dataset.name = (u.display_name + ' ' + u.username).toLowerCase();
      tr.dataset.uid  = u.id;
      tr.addEventListener('click', e => {
        if (e.target.tagName === 'SELECT') return; // не открывать при клике на select
        openDetail(u);
      });

      const mentorOpts = mentorOptions.replace(
        `value="${u.mentor_id || ''}"`,
        `value="${u.mentor_id || ''}" selected`
      );
      const roleOpts = roleOptions.replace(
        `value="${u.role}"`,
        `value="${u.role}" selected`
      );

      tr.innerHTML = `
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="emp-avatar">${(u.display_name||u.username).charAt(0).toUpperCase()}</div>
            <div>
              <div class="emp-name">${u.display_name || u.username}</div>
              <div class="emp-username">@${u.username}</div>
            </div>
          </div>
        </td>
        <td>${roleBadge(u.role)}</td>
        <td style="font-size:13px;color:var(--text-primary)">
          LVL ${u.level}<br>
          <span style="font-size:10px;color:var(--text-dim)">${u.level_title}</span>
        </td>
        <td class="xp-cell">${u.total_xp}</td>
        <td>
          <div class="progress-wrap">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width:${u.completion_pct}%"></div>
            </div>
            <div class="progress-label">${u.quests_completed}/${u.quests_total} (${u.completion_pct}%)</div>
          </div>
        </td>
        <td class="mentor-cell">
          ${_myRole === 'admin' || _myRole === 'hr'
            ? `<select class="select-sm" data-uid="${u.id}" onchange="changeMentor(this)">${mentorOpts}</select>`
            : (u.mentor_name || '—')
          }
        </td>
        <td class="date-cell">${fmtDate(u.last_active_at)}</td>
        <td>
          ${_myRole === 'admin'
            ? `<select class="select-sm" data-uid="${u.id}" onchange="changeRole(this)">${roleOpts}</select>`
            : roleBadge(u.role)
          }
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase();
    renderTable(_allEmployees.filter(u =>
      (u.display_name + ' ' + u.username).toLowerCase().includes(q)
    ));
  }

  async function changeRole(select) {
    const uid = parseInt(select.dataset.uid);
    const role = select.value;
    try {
      await apiFetch(`/api/admin/users/${uid}/role`, { method:'PATCH', body:JSON.stringify({ role }) });
      await loadEmployees();
    } catch(e) { alert('Ошибка: ' + e.message); await loadEmployees(); }
  }

  async function changeMentor(select) {
    const uid = parseInt(select.dataset.uid);
    const mentor_id = select.value ? parseInt(select.value) : null;
    try {
      await apiFetch(`/api/admin/users/${uid}/mentor`, { method:'PATCH', body:JSON.stringify({ mentor_id }) });
      await loadEmployees();
    } catch(e) { alert('Ошибка: ' + e.message); await loadEmployees(); }
  }

  // ── Детальная панель квестов ──────────────────────────────
  let _currentUserId = null;

  function openDetail(user) {
    _currentUserId = user.id;
    document.getElementById('detail-name').textContent = user.display_name || user.username;
    document.getElementById('detail-meta').textContent =
      `LVL ${user.level} · ${user.level_title} · ${user.total_xp} XP`;
    document.getElementById('detail-body').innerHTML = '<div class="loading">Загрузка квестов...</div>';
    document.getElementById('detail-panel').classList.add('open');
    document.getElementById('overlay').classList.add('open');
    loadDetailQuests(user.id);
  }

  function closeDetail() {
    document.getElementById('detail-panel').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  async function loadDetailQuests(userId) {
    try {
      const quests = await apiFetch(`/api/admin/users/${userId}/quests`);
      const body = document.getElementById('detail-body');
      body.innerHTML = '';

      if (!quests.length) {
        body.innerHTML = '<div class="empty">Нет квестов</div>';
        return;
      }

      quests.forEach(q => {
        const div = document.createElement('div');
        div.className = `quest-row ${q.status}`;
        div.innerHTML = `
          <div class="quest-icon">${QUEST_ICONS[q.type] || '🎯'}</div>
          <div class="quest-info">
            <div class="quest-title-sm">${q.title}</div>
            <div class="quest-status-sm status-${q.status}">
              ${STATUS_LABELS[q.status] || q.status}
              ${q.completed_at ? ' · ' + new Date(q.completed_at).toLocaleDateString('ru-RU') : ''}
            </div>
          </div>
          <div class="quest-xp">+${q.xp_reward} XP</div>
        `;
        body.appendChild(div);
      });
    } catch(e) {
      document.getElementById('detail-body').innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`;
    }
  }

  // ── Safety Check ──────────────────────────────────────────
  async function loadSafety() {
    document.getElementById('safety-loading').style.display = 'block';
    document.getElementById('safety-grid').style.display    = 'none';
    try {
      const data = await apiFetch('/api/admin/safety/today');
      const passed = data.filter(u => u.passed_today);
      document.getElementById('stat-safety').textContent = `${passed.length}/${data.length}`;

      // Сортируем: сначала прошедшие (по времени), потом не заходившие
      const sorted = [
        ...data.filter(u => u.passed_today).sort((a,b) => new Date(b.last_check_at) - new Date(a.last_check_at)),
        ...data.filter(u => !u.passed_today),
      ];

      document.getElementById('safety-list').innerHTML = sorted.length
        ? sorted.map(u => `
            <div class="safety-item ${u.passed_today ? 'passed' : 'failed'}">
              <span style="font-size:18px">${u.passed_today ? '✅' : '🕐'}</span>
              <div style="flex:1">
                <div class="safety-name">${u.display_name}</div>
                <div class="safety-time">${u.passed_today ? 'Прошёл сегодня в ' + fmtTime(u.last_check_at) : 'Ещё не заходил сегодня'}</div>
              </div>
            </div>`).join('')
        : '<div class="empty">Нет сотрудников</div>';

      document.getElementById('safety-loading').style.display = 'none';
      document.getElementById('safety-grid').style.display    = 'grid';
    } catch(e) {
      document.getElementById('safety-loading').textContent = 'Ошибка: ' + e.message;
    }
  }

  async function downloadPDF(period) {
    if (!_currentUserId) return;
    const btn = event.target;
    const origText = btn.textContent;
    btn.textContent = '⏳';
    btn.disabled = true;

    try {
      const resp = await fetch(`/api/admin/users/${_currentUserId}/report.pdf?period=${period}`, { headers });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const blob = await resp.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `report_${period}d.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } catch(e) {
      alert('Ошибка генерации PDF: ' + e.message);
    } finally {
      btn.textContent = origText;
      btn.disabled = false;
    }
  }

  loadEmployees();
  loadSafety();
</script>
</body>
</html>
