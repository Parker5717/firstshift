<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

  <!-- Левое ухо -->
  <path d="M 23 47 L 13 18 L 43 32 Z" fill="#C46840"/>
  <path d="M 25 45 L 17 22 L 40 33 Z" fill="#E8916A"/>

  <!-- Правое ухо -->
  <path d="M 77 47 L 87 18 L 57 32 Z" fill="#C46840"/>
  <path d="M 75 45 L 83 22 L 60 33 Z" fill="#E8916A"/>

  <!-- Голова -->
  <circle cx="50" cy="56" r="36" fill="#D4764E"/>

  <!-- Три полоски на лбу -->
  <line x1="43" y1="23" x2="41" y2="36" stroke="#8B4020" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="50" y1="21" x2="50" y2="34" stroke="#8B4020" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="57" y1="23" x2="59" y2="36" stroke="#8B4020" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Белки глаз -->
  <ellipse cx="37" cy="52" rx="9" ry="10" fill="#F4EDE3"/>
  <ellipse cx="63" cy="52" rx="9" ry="10" fill="#F4EDE3"/>

  <!-- Радужка (янтарь) -->
  <ellipse cx="37" cy="52" rx="6.5" ry="7.5" fill="#C49640"/>
  <ellipse cx="63" cy="52" rx="6.5" ry="7.5" fill="#C49640"/>

  <!-- Зрачок (вертикальный кошачий) -->
  <ellipse cx="37" cy="52" rx="2.8" ry="5.5" fill="#131210"/>
  <ellipse cx="63" cy="52" rx="2.8" ry="5.5" fill="#131210"/>

  <!-- Блик в глазах -->
  <circle cx="38.5" cy="49.5" r="1.8" fill="white" opacity="0.9"/>
  <circle cx="64.5" cy="49.5" r="1.8" fill="white" opacity="0.9"/>

  <!-- Полоски на щеках — левые -->
  <line x1="14" y1="57" x2="27" y2="60" stroke="#8B4020" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="13" y1="64" x2="26" y2="66" stroke="#8B4020" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="15" y1="71" x2="27" y2="72" stroke="#8B4020" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Полоски на щеках — правые -->
  <line x1="86" y1="57" x2="73" y2="60" stroke="#8B4020" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="87" y1="64" x2="74" y2="66" stroke="#8B4020" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="85" y1="71" x2="73" y2="72" stroke="#8B4020" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Морда (светлая область) -->
  <ellipse cx="50" cy="71" rx="18" ry="13" fill="#F4EDE3"/>

  <!-- Нос -->
  <path d="M 46 65 Q 50 62 54 65 L 50 70 Z" fill="#8B4020"/>

  <!-- Линия от носа до рта -->
  <line x1="50" y1="70" x2="50" y2="72.5" stroke="#8B4020" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Рот -->
  <path d="M 50 72.5 Q 45.5 77.5 41 75.5" stroke="#8B4020" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 50 72.5 Q 54.5 77.5 59 75.5" stroke="#8B4020" stroke-width="1.5" stroke-linecap="round" fill="none"/>

</svg>
