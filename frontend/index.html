<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FirstShift — Первый день на заводе</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap');

    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; background: #070b14;
    }

    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,170,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,170,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      pointer-events: none;
    }
    .bg-glow {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,100,255,0.12), transparent),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(0,200,100,0.06), transparent);
      pointer-events: none;
    }
    .particle {
      position: fixed; width: 2px; height: 2px;
      background: var(--accent); border-radius: 50%;
      animation: float linear infinite; opacity: 0; pointer-events: none;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; } 90% { opacity: 0.3; }
      100% { transform: translateY(-20px) scale(1); opacity: 0; }
    }

    .login-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px; padding: 0 24px;
      display: flex; flex-direction: column; align-items: center;
    }

    .logo-area {
      text-align: center; margin-bottom: 24px;
      animation: logoIn 0.8s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo-robot {
      font-size: 64px; display: block; margin-bottom: 10px;
      filter: drop-shadow(0 0 24px rgba(0,170,255,0.6));
      animation: robotPulse 3s ease-in-out infinite;
    }
    @keyframes robotPulse {
      0%, 100% { filter: drop-shadow(0 0 24px rgba(0,170,255,0.6)); transform: scale(1); }
      50%       { filter: drop-shadow(0 0 40px rgba(0,170,255,0.9)); transform: scale(1.05); }
    }
    .logo-name {
      font-family: 'Orbitron', monospace; font-size: 30px; font-weight: 900;
      letter-spacing: 6px; color: #fff;
      text-shadow: 0 0 20px rgba(0,170,255,0.8), 0 0 60px rgba(0,170,255,0.3);
    }
    .logo-tagline {
      font-size: 12px; color: var(--text-secondary);
      letter-spacing: 2px; text-transform: uppercase; margin-top: 6px;
      font-family: 'Inter', sans-serif;
    }

    .features {
      display: flex; gap: 10px; margin-bottom: 20px;
      animation: fadeIn 0.8s 0.3s ease forwards; opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .feature {
      flex: 1; padding: 8px 6px; border-radius: 10px;
      border: 1px solid rgba(0,170,255,0.2); background: rgba(0,170,255,0.04);
      text-align: center; font-size: 10px; color: var(--text-secondary); line-height: 1.4;
    }
    .feature .icon { font-size: 18px; display: block; margin-bottom: 3px; }

    /* Таб-переключатель */
    .tab-switch {
      display: flex; width: 100%;
      background: rgba(0,170,255,0.06); border: 1px solid rgba(0,170,255,0.2);
      border-radius: 10px; padding: 3px; margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1; padding: 9px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: all 0.2s;
      background: transparent; color: var(--text-secondary);
    }
    .tab-btn.active {
      background: var(--accent); color: #fff;
      box-shadow: 0 2px 12px rgba(0,170,255,0.4);
    }

    /* Карточка формы */
    .login-box {
      width: 100%; padding: 24px 22px; border-radius: 20px;
      border: 1px solid rgba(0,170,255,0.3); background: rgba(7,11,20,0.9);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 0 1px rgba(0,170,255,0.1), 0 24px 48px rgba(0,0,0,0.4),
                  inset 0 1px 0 rgba(255,255,255,0.05);
      animation: boxIn 0.8s 0.2s cubic-bezier(0.4,0,0.2,1) both;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    @keyframes boxIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Красная рамка карточки при ошибке — без animation, только border */
    .login-box.error-state {
      border-color: rgba(255,51,85,0.6);
      box-shadow: 0 0 0 3px rgba(255,51,85,0.2), 0 24px 48px rgba(0,0,0,0.4);
    }

    .input-group { margin-bottom: 12px; }
    .input-group input {
      width: 100%; padding: 13px 16px; box-sizing: border-box;
      background: rgba(0,170,255,0.05); border: 1px solid rgba(0,170,255,0.2);
      border-radius: 12px; color: var(--text-primary);
      font-size: 16px; font-family: 'Inter', sans-serif;
      outline: none; transition: all 0.25s ease;
    }
    .input-group input:focus {
      border-color: var(--accent); background: rgba(0,170,255,0.08);
      box-shadow: 0 0 0 3px rgba(0,170,255,0.15);
    }
    .input-group input::placeholder { color: var(--text-dim); }

    /* Красная подсветка полей при ошибке */
    .input-group.input-error input {
      border-color: #ff3355 !important;
      background: rgba(255,51,85,0.07) !important;
      box-shadow: 0 0 0 3px rgba(255,51,85,0.18) !important;
    }

    .btn-login {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #0077ee, #00aaff);
      color: #fff; font-size: 15px; font-weight: 700;
      font-family: 'Inter', sans-serif; letter-spacing: 0.5px;
      cursor: pointer; transition: all 0.2s ease; overflow: hidden; position: relative;
    }
    .btn-login::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .btn-login:hover::after { opacity: 1; }
    .btn-login:hover { box-shadow: 0 8px 24px rgba(0,170,255,0.4); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.5; cursor: default; transform: none; }

    /* Блок ошибки */
    .error-msg {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 20px; margin-top: 10px;
      font-size: 13px; font-weight: 600; color: #ff3355;
      font-family: 'Inter', sans-serif;
      opacity: 0; transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }
    .error-msg.visible { opacity: 1; transform: translateY(0); }

    .bottom-links {
      display: flex; gap: 16px; margin-top: 20px;
      animation: fadeIn 0.8s 0.5s ease both;
    }
    .bottom-links a {
      font-size: 12px; color: var(--text-dim); text-decoration: none;
      font-family: 'Inter', sans-serif; transition: color 0.2s;
    }
    .bottom-links a:hover { color: var(--accent); }

    .version {
      position: fixed; bottom: 16px; right: 16px;
      font-size: 10px; color: var(--text-dim); font-family: monospace; opacity: 0.5;
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="login-wrap">

  <div class="logo-area">
    <span class="logo-robot">🤖</span>
    <div class="logo-name">FIRSTSHIFT</div>
    <div class="logo-tagline">AR-помощник на производстве</div>
  </div>

  <div class="features">
    <div class="feature"><span class="icon">📷</span>AR-камера</div>
    <div class="feature"><span class="icon">🎯</span>Квесты</div>
    <div class="feature"><span class="icon">🏆</span>Ачивки</div>
    <div class="feature"><span class="icon">🛡️</span>Безопасность</div>
  </div>

  <div class="tab-switch">
    <button class="tab-btn active" id="tab-login"    onclick="switchTab('login')">Войти</button>
    <button class="tab-btn"        id="tab-register" onclick="switchTab('register')">Регистрация</button>
  </div>

  <div class="login-box" id="login-box">
    <div class="input-group" id="group-username">
      <input type="text" id="username-input"
        placeholder="Логин (a-z, 0-9, _, -)"
        maxlength="32" autocomplete="username"
        autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="input-group" id="group-password">
      <input type="password" id="password-input"
        placeholder="Пароль (минимум 6 символов)"
        maxlength="128" autocomplete="current-password">
    </div>

    <div class="input-group" id="group-displayname" style="display:none">
      <input type="text" id="displayname-input"
        placeholder="Имя для отображения (необязательно)"
        maxlength="64" autocomplete="name">
    </div>

    <div class="input-group" id="group-birthyear" style="display:none">
      <select id="birthyear-input" style="
        width:100%; padding:13px 16px; box-sizing:border-box;
        background:rgba(0,170,255,0.05); border:1px solid rgba(0,170,255,0.2);
        border-radius:12px; color:var(--text-primary);
        font-size:16px; font-family:'Inter',sans-serif; outline:none;
      ">
        <option value="">Год рождения (необязательно)</option>
      </select>
    </div>

    <div id="group-privacy" style="display:none;margin-bottom:12px">
      <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12px;color:var(--text-secondary);line-height:1.5">
        <input type="checkbox" id="privacy-checkbox" style="margin-top:2px;flex-shrink:0;accent-color:var(--accent)">
        <span>Согласен с <a href="/privacy" target="_blank" style="color:var(--accent)">политикой обработки данных</a> (152-ФЗ). Система не сохраняет биометрию.</span>
      </label>
    </div>

    <button class="btn-login" id="btn-submit">Войти →</button>

    <div class="error-msg" id="error-msg">⚠️ <span id="error-text"></span></div>
  </div>

  <div class="bottom-links">
    <a href="/markers">🖨️ Маркеры для печати</a>
    <a href="/docs" target="_blank">📖 API Docs</a>
  </div>
</div>

<div class="version">FirstShift v0.2.0</div>

<script src="/static/js/api.js"></script>
<script>
  if (API.hasToken()) window.location.href = '/safety';

  // Заполняем select года рождения
  (function() {
    const sel = document.getElementById('birthyear-input');
    const curYear = new Date().getFullYear();
    for (let y = curYear - 18; y >= curYear - 65; y--) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      sel.appendChild(opt);
    }
  })();

  // Частицы фона
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay   = (Math.random() * 10) + 's';
    document.body.appendChild(p);
  }

  let _mode = 'login';

  function switchTab(mode) {
    _mode = mode;
    document.getElementById('tab-login').classList.toggle('active',    mode === 'login');
    document.getElementById('tab-register').classList.toggle('active', mode === 'register');
    document.getElementById('group-displayname').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('group-birthyear').style.display   = mode === 'register' ? 'block' : 'none';
    document.getElementById('group-privacy').style.display      = mode === 'register' ? 'block' : 'none';
    document.getElementById('btn-submit').textContent = mode === 'login' ? 'Войти →' : 'Создать аккаунт →';
    document.getElementById('password-input').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    hideError();
    document.getElementById('username-input').focus();
  }

  // ---------- Визуальная ошибка ----------
  function showError(message, fields = ['username', 'password']) {
    // Текст
    document.getElementById('error-text').textContent = message;
    const errorEl = document.getElementById('error-msg');
    errorEl.classList.add('visible');

    // Красная подсветка полей
    fields.forEach(f => {
      const g = document.getElementById('group-' + f);
      if (g) g.classList.add('input-error');
    });

    // Shake через Web Animations API — не конфликтует с CSS анимациями
    const box = document.getElementById('login-box');
    box.classList.add('error-state');
    box.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(-8px)' },
      { transform: 'translateX(8px)' },
      { transform: 'translateX(-6px)' },
      { transform: 'translateX(6px)' },
      { transform: 'translateX(-3px)' },
      { transform: 'translateX(2px)' },
      { transform: 'translateX(0)' },
    ], { duration: 420, easing: 'ease' });
    setTimeout(() => box.classList.remove('error-state'), 2500);

    // Убираем красные рамки через 2.5 сек
    setTimeout(() => {
      fields.forEach(f => {
        const g = document.getElementById('group-' + f);
        if (g) g.classList.remove('input-error');
      });
    }, 2500);
  }

  function hideError() {
    document.getElementById('error-msg').classList.remove('visible');
    ['username', 'password', 'displayname'].forEach(f => {
      document.getElementById('group-' + f)?.classList.remove('input-error');
    });
  }

  // ---------- Валидация ----------
  function validate() {
    const username = document.getElementById('username-input').value.trim();
    const password = document.getElementById('password-input').value;

    if (!username) return { msg: 'Введи логин', fields: ['username'] };
    if (!/^[a-zA-Z0-9_\-]+$/.test(username))
      return { msg: 'Логин: только a-z, 0-9, _ и -', fields: ['username'] };
    if (username.length < 2)
      return { msg: 'Логин минимум 2 символа', fields: ['username'] };
    if (!password) return { msg: 'Введи пароль', fields: ['password'] };
    if (password.length < 6)
      return { msg: 'Пароль минимум 6 символов', fields: ['password'] };
    return null;
  }

  // ---------- Отправка ----------
  async function doSubmit() {
    const btn = document.getElementById('btn-submit');
    hideError();

    const err = validate();
    if (err) { showError(err.msg, err.fields); return; }

    const username    = document.getElementById('username-input').value.trim();
    const password    = document.getElementById('password-input').value;
    const displayName = document.getElementById('displayname-input').value.trim();
    const birthYear   = parseInt(document.getElementById('birthyear-input').value) || null;

    btn.disabled = true;
    btn.textContent = '⏳ Подключение...';

    if (_mode === 'register') {
      const privacyOk = document.getElementById('privacy-checkbox').checked;
      if (!privacyOk) {
        showError('Необходимо принять политику обработки данных', []);
        btn.disabled = false;
        btn.textContent = 'Создать аккаунт →';
        return;
      }
    }

    try {
      if (_mode === 'login') {
        await API.login(username, password);
      } else {
        await API.register(username, password, displayName || null, true, birthYear);
      }
      btn.textContent = '✅ Входим...';
      setTimeout(() => window.location.href = '/safety', 400);
    } catch (apiErr) {
      const msg = apiErr.message || 'Ошибка подключения';
      showError(msg, ['username', 'password']);
      btn.disabled = false;
      btn.textContent = _mode === 'login' ? 'Войти →' : 'Создать аккаунт →';
    }
  }

  document.getElementById('btn-submit').addEventListener('click', doSubmit);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doSubmit(); });

  // Сбрасываем ошибку при вводе
  ['username-input', 'password-input', 'displayname-input'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', hideError);
  });

  switchTab('login');
  document.getElementById('username-input').focus();
</script>
</body>
</html>
